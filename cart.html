<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Order | Campus Snack Bar POS</title>
<style>*{box-sizing:border-box;margin:0}body{font:16px 'Segoe UI',system-ui,sans-serif;background:#fff6ec;color:#2a211a;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 5vw;background:#2a211a;color:#fff;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#fff;text-decoration:none}.brand img{width:36px}
.steps{display:flex;gap:6px;font-size:13px}.steps span{padding:5px 12px;border-radius:99px;background:#fff2;transition:.3s}.steps .on{background:#ff5a1f}
main{max-width:1000px;margin:auto;padding:28px 5vw 110px;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:30px}.sub{color:#8a7a6c;margin:4px 0 22px}
.btn{border:0;border-radius:12px;padding:12px 22px;font:700 15px 'Segoe UI',sans-serif;background:#ff5a1f;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #ff5a1f55}.btn.alt{background:#2a211a}.btn:disabled{opacity:.4;pointer-events:none}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 24px #0001}
.acts{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
.tot{display:flex;justify-content:space-between;font-size:24px;font-weight:800;margin:16px 0}

.row{display:grid;grid-template-columns:70px 1fr auto 100px auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #f0e4d6;animation:in .4s}.row img{width:70px;border-radius:12px}.row small{display:block;color:#8a7a6c}.s{text-align:right}
.q{display:flex;gap:10px;align-items:center}.q button{width:34px;height:34px;border-radius:50%;border:0;background:#ffe3c4;font-size:18px;cursor:pointer;transition:.2s}.q button:hover{background:#ff5a1f;color:#fff}
.x{background:none;border:0;color:#c0392b;cursor:pointer}.empty{padding:30px;text-align:center;color:#8a7a6c}
@media(max-width:640px){.row{grid-template-columns:56px 1fr auto}.row img{width:56px}.s,.x{grid-column:2/4}}
</style></head><body>
<main><h1>Review Order</h1><p class="sub">Adjust quantities, then continue to payment. Press Enter to proceed.</p>
<div class="card"><div id="list"></div><div class="tot"><span>Total</span><span id="tot"></span></div>
<div class="acts"><a class="btn alt" href="index.html">Back to Menu</a><button class="btn" id="go">Proceed to Payment</button></div></div></main>
<script src="js/app.js"></script>
<script>
hdr(1);
function render(){const L=lines();list.innerHTML=L.length?L.map(l=>`<div class="row"><img src="${l.img}" alt=""><div><b>${l.name}</b><small>${peso(l.price)} each</small></div><div class="q"><button data-a="-" data-id="${l.id}" aria-label="Decrease">&minus;</button><b>${l.q}</b><button data-a="+" data-id="${l.id}" aria-label="Increase">+</button></div><b class="s">${peso(l.sub)}</b><button class="x" data-a="x" data-id="${l.id}">Remove</button></div>`).join(""):`<p class="empty">Your cart is empty. <a href="index.html">Browse the menu</a></p>`;tot.textContent=peso(total());go.disabled=!L.length}
list.onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id,q=cart()[id]||0;setQty(id,b.dataset.a=="+"?q+1:b.dataset.a=="-"?q-1:0);render()};
go.onclick=()=>location="payment.html";
addEventListener("keydown",e=>{if(e.key=="Enter"&&document.activeElement==document.body&&!go.disabled)go.click()});
render();
</script></body></html>
