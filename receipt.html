<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt | Campus Snack Bar POS</title>
<style>*{box-sizing:border-box;margin:0}body{font:16px 'Segoe UI',system-ui,sans-serif;background:#fff6ec;color:#2a211a;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 5vw;background:#2a211a;color:#fff;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#fff;text-decoration:none}.brand img{width:36px}
.steps{display:flex;gap:6px;font-size:13px}.steps span{padding:5px 12px;border-radius:99px;background:#fff2;transition:.3s}.steps .on{background:#ff5a1f}
main{max-width:1000px;margin:auto;padding:28px 5vw 110px;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
h1{font-size:30px}.sub{color:#8a7a6c;margin:4px 0 22px}
.btn{border:0;border-radius:12px;padding:12px 22px;font:700 15px 'Segoe UI',sans-serif;background:#ff5a1f;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #ff5a1f55}.btn.alt{background:#2a211a}.btn:disabled{opacity:.4;pointer-events:none}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 24px #0001}
.acts{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
.tot{display:flex;justify-content:space-between;font-size:24px;font-weight:800;margin:16px 0}

main{max-width:460px}.rc{background:#fff;padding:26px;border-radius:6px;box-shadow:0 10px 34px #0002;font-family:'Courier New',monospace;animation:sl .7s}@keyframes sl{from{opacity:0;transform:translateY(-40px) scaleY(.8)}}
.c{text-align:center}.c img{width:48px}.c h2{font-family:'Segoe UI',sans-serif}hr{border:0;border-top:2px dashed #cbb9a6;margin:14px 0}.r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.g{font-weight:800;font-size:19px}
@media print{header,.acts{display:none}body{background:#fff}.rc{box-shadow:none}}
</style></head><body>
<main><div class="rc"><div class="c"><img src="images/logo.svg" alt=""><h2>Campus Snack Bar</h2><div id="meta"></div></div><hr><div id="L"></div><hr><div id="S"></div><hr><p class="c">Thank you! Enjoy your meal.</p></div>
<div class="acts"><button class="btn alt" onclick="print()">Print Receipt</button><button class="btn" id="nw">New Transaction <small>(N)</small></button></div></main>
<script src="js/app.js"></script>
<script>
hdr(4);const t=get("txn");if(!t)location="index.html";
meta.innerHTML=`<div>Receipt No. ${t.id}</div><div>${new Date(t.date).toLocaleString("en-PH")}</div>`;
L.innerHTML=t.lines.map(l=>`<div class="r"><span>${l.q} x ${l.name}<br>&nbsp;&nbsp;@ ${peso(l.price)}</span><b>${peso(l.sub)}</b></div>`).join("");
S.innerHTML=`<div class="r g"><span>TOTAL</span><span>${peso(t.total)}</span></div><div class="r"><span>Cash</span><span>${peso(t.paid)}</span></div><div class="r"><span>Change</span><span>${peso(t.change)}</span></div>`;
function newTx(){localStorage.removeItem("cart");localStorage.removeItem("txn");location="index.html"}
nw.onclick=newTx;addEventListener("keydown",e=>{if(e.key.toLowerCase()=="n")newTx()});
</script></body></html>
